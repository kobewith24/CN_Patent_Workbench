server:
  address: 127.0.0.1
  port: ${PATENT_PORT:8088}
  shutdown: graceful
  error:
    include-message: always
spring:
  mvc:
    async:
      request-timeout: 180000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
logging:
  level:
    root: INFO
    dev.langchain4j: WARN
  file:
    name: logs/workbench.log
