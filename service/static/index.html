<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专利技术情报问答</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#111827; --muted:#6b7280;
          --brand:#1d4ed8; --line:#e5e7eb; --ok:#047857; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; }
  header { background:#0f172a; color:#fff; padding:20px 28px; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header p { margin:6px 0 0; color:#cbd5e1; font-size:13px; }
  main { max-width:1120px; margin:22px auto 60px; padding:0 18px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  input, select { padding:10px 12px; border:1px solid #d1d5db; border-radius:9px;
                  font-size:14px; background:#fff; color:var(--ink); }
  input#q { flex:1 1 420px; }
  button { padding:10px 22px; border:0; border-radius:9px; background:var(--brand);
           color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { background:#93c5fd; cursor:default; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .filters label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  .filters input, .filters select { padding:7px 9px; font-size:13px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .answer { white-space:pre-wrap; line-height:1.75; font-size:15px; }
  .cite { color:var(--brand); font-weight:600; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; background:#eef2ff; color:#3730a3; }
  .badge.ok { background:#ecfdf5; color:var(--ok); }
  .badge.bad { background:#fef2f2; color:var(--bad); }
  .sources { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
  .source { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fcfcfd; }
  .source.uncited { border-style:dashed; opacity:.72; }
  .source h4 { margin:0 0 6px; font-size:14px; line-height:1.4; }
  .source .kv { color:var(--muted); font-size:12px; }
  .source p { margin:8px 0 0; font-size:12px; color:#374151; line-height:1.6; }
  .claims { display:flex; flex-direction:column; gap:8px; }
  .claim { border-left:3px solid var(--line); padding:8px 12px; background:#fcfcfd; }
  .claim.ok { border-left-color:var(--ok); }
  .claim.bad { border-left-color:var(--bad); }
  .claim .txt { font-size:13px; line-height:1.6; }
  .claim .why { color:var(--muted); font-size:12px; margin-top:4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .empty { color:var(--muted); font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>专利技术情报问答</h1>
  <p>52 万件中文专利（2015–2024）· 单索引检索 · IPC/年份/类型/城市过滤 · 带专利号引用与逐句支撑校验</p>
</header>

<main>
  <div class="panel">
    <div class="row">
      <input id="q" placeholder="例如：2020 年以后 G06T 领域有哪些基于深度学习的图像去噪专利？" autocomplete="off">
      <button id="ask">提问</button>
    </div>
    <details style="margin-top:10px">
      <summary class="meta" style="cursor:pointer">过滤条件（可选）</summary>
      <div class="filters">
        <label>IPC 部类
          <select id="ipc">
            <option value="">全部</option>
            <option>A</option><option>B</option><option>C</option><option>D</option>
            <option>E</option><option>F</option><option>G</option><option>H</option>
          </select>
        </label>
        <label>年份从 <input id="year_from" type="number" min="2015" max="2024" style="width:90px"></label>
        <label>年份到 <input id="year_to" type="number" min="2015" max="2024" style="width:90px"></label>
        <label>专利类型
          <select id="ptype">
            <option value="">全部</option>
            <option>发明申请</option><option>发明授权</option><option>实用新型</option>
          </select>
        </label>
        <label>城市 <input id="city" placeholder="如 深圳" style="width:110px"></label>
      </div>
    </details>
    <div class="meta" id="status">就绪</div>
  </div>

  <div class="panel hidden" id="result">
    <h2>答案</h2>
    <div class="badges" id="badges"></div>
    <div class="answer" id="answer"></div>
    <div class="meta" id="timing"></div>

    <h2 style="margin-top:18px">引用专利</h2>
    <div class="sources" id="sources"></div>

    <h2 style="margin-top:18px">逐句支撑校验</h2>
    <div class="claims" id="claims"></div>
  </div>

  <div class="panel hidden" id="error">
    <h2 style="color:var(--bad)">出错了</h2>
    <div class="answer" id="error_text"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function params() {
  const p = new URLSearchParams({ q: $("q").value.trim(), k: "5" });
  const map = { ipc: "ipc_section", year_from: "year_from", year_to: "year_to",
                ptype: "patent_type", city: "city" };
  for (const [id, key] of Object.entries(map)) {
    const v = $(id).value.trim();
    if (v) p.set(key, v);
  }
  return p;
}

function renderAnswer(text) {
  return esc(text).replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>').replace(/\n/g, "<br>");
}

function render(data) {
  $("result").classList.remove("hidden");
  $("error").classList.add("hidden");
  $("answer").innerHTML = renderAnswer(data.answer || "");
  $("timing").innerHTML =
    `检索 ${data.retrieval_ms} ms · 生成 ${data.generation_ms} ms · 总计 ${data.elapsed_ms} ms` +
    ` · trace <a href="/trace/${data.trace_id}" target="_blank">${data.trace_id}</a>`;

  const f = data.faithfulness;
  const badges = [];
  if (f != null && f >= 0) {
    badges.push(`<span class="badge ${f >= 0.8 ? "ok" : "bad"}">忠实度 ${(f * 100).toFixed(0)}%</span>`);
  } else {
    badges.push('<span class="badge">未做支撑校验</span>');
  }
  if (data.sub_queries && data.sub_queries.length > 1) {
    badges.push(`<span class="badge">拆分为 ${data.sub_queries.length} 个子查询</span>`);
  }
  const uncited = new Set(data.uncited_ranks || []);
  badges.push(`<span class="badge">${(data.cited_ranks || []).length}/${data.sources.length} 条被引用</span>`);
  if (uncited.size) {
    badges.push(`<span class="badge bad">${uncited.size} 条未被答案引用</span>`);
  }
  $("badges").innerHTML = badges.join("");

  $("sources").innerHTML = (data.sources || []).map(s => `
    <div class="source ${uncited.has(s.rank) ? "uncited" : ""}">
      <h4>[${s.rank}] ${esc(s.title)} ${uncited.has(s.rank) ? '<span class="badge bad">未被答案引用</span>' : ''}</h4>
      <div class="kv">${esc(s.doc_id)} · ${esc(s.ipc_main || "IPC 缺失")} · ${s.year} · ${esc(s.patent_type)} · ${esc(s.city || "")}</div>
      <div class="kv">rerank 分数 ${s.score}</div>
      <p>${esc((s.abstract || "").slice(0, 220))}${(s.abstract || "").length > 220 ? "…" : ""}</p>
    </div>`).join("");

  const claims = data.claims || [];
  if (!claims.length) {
    $("claims").innerHTML = '<div class="empty">没有可校验的带引用结论。</div>';
  } else {
    $("claims").innerHTML = claims.map(c => `
      <div class="claim ${c.supported ? "ok" : "bad"}">
        <div class="txt">${esc(c.sentence)}</div>
        <div class="why">${c.supported ? "有摘要支撑" : "未找到明确支撑"} · 引用 ${ (c.refs || []).map(r => "[" + r + "]").join(" ") } · ${esc(c.verified_by || "")} ${c.reason ? "· " + esc(c.reason) : ""}</div>
      </div>`).join("");
  }
}

async function ask() {
  const q = $("q").value.trim();
  if (!q) return;
  $("ask").disabled = true;
  $("status").textContent = "检索并生成中…（首次可能 10 秒左右）";
  try {
    const r = await fetch("/answer?" + params().toString());
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 300));
    const data = await r.json();
    render(data);
    $("status").textContent = "完成";
  } catch (e) {
    $("error").classList.remove("hidden");
    $("error_text").textContent = String(e);
    $("status").textContent = "失败";
  } finally {
    $("ask").disabled = false;
  }
}

$("ask").addEventListener("click", ask);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
